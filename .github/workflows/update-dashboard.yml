name: Update GitHub dashboard

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/github-dashboard.cjs
      - .github/workflows/update-dashboard.yml
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Fetch public GitHub data and render charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-dashboard.cjs
      - name: Check profile assets and statistics
        run: node scripts/check-profile.cjs
      - name: Commit updated statistics
        run: |
          git add data/github-metrics.json assets/github-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public GitHub dashboard'
          git push
