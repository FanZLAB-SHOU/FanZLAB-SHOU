<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" role="img"><title>Five research directions — populations and assessment; AI and vessel behaviour; biology and DNA; ocean change; adaptive fisheries management. ALSCL puts these quantitative methods into practice.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b263c"/><stop offset="1" stop-color="#06131f"/></linearGradient><linearGradient id="accent"><stop stop-color="#79b9ff"/><stop offset="1" stop-color="#79dfd0"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="1198" height="640" rx="24" fill="#081827" stroke="#24465e"/><text x="30" y="41" fill="#79dfd0" font-size="13" font-weight="700" letter-spacing="2.3">OUR RESEARCH</text><text x="30" y="81" fill="#edf6ff" font-size="32" font-weight="650" letter-spacing="-.7">Five directions. One connected ocean.</text><g transform="translate(15 110)"><rect width="376" height="244" rx="16" fill="#102a3f" stroke="#24465e"/><path d="M23 0h68" stroke="#79b9ff" stroke-width="2"/><text x="23" y="35" fill="#a7bfd0" font-size="12" font-weight="600" letter-spacing="1.5">POPULATIONS</text><text x="353" y="35" fill="#79dfd0" font-size="13" font-weight="600" text-anchor="end">01</text><g transform="translate(23 56) scale(.63)" fill="none" stroke="#79b9ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 44V5m0 39h46M11 35c9-1 8-25 19-25s8 17 20 10"/></g><text x="23" y="124" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">Population dynamics</text><text x="23" y="153" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">&amp; stock assessment</text><text x="23" y="193" fill="#a7bfd0" font-size="16" font-weight="400" >Models of growth, recruitment</text><text x="23" y="222" fill="#a7bfd0" font-size="16" font-weight="400" >and mortality.</text></g><g transform="translate(409 110)"><rect width="376" height="244" rx="16" fill="#102a3f" stroke="#24465e"/><path d="M23 0h68" stroke="#79dfd0" stroke-width="2"/><text x="23" y="35" fill="#a7bfd0" font-size="12" font-weight="600" letter-spacing="1.5">FISHERIES DATA</text><text x="353" y="35" fill="#79dfd0" font-size="13" font-weight="600" text-anchor="end">02</text><g transform="translate(23 56) scale(.63)" fill="none" stroke="#79dfd0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 40 17 17l17 16L49 8" stroke-dasharray="3 4"/><circle cx="4" cy="40" r="3"/><circle cx="17" cy="17" r="3"/><circle cx="34" cy="33" r="3"/><circle cx="49" cy="8" r="3"/></g><text x="23" y="124" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">Artificial intelligence</text><text x="23" y="153" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">&amp; vessel behaviour</text><text x="23" y="193" fill="#a7bfd0" font-size="16" font-weight="400" >Fishing activity and fleet dynamics</text><text x="23" y="222" fill="#a7bfd0" font-size="16" font-weight="400" >through vessel-tracking data.</text></g><g transform="translate(803 110)"><rect width="376" height="244" rx="16" fill="#102a3f" stroke="#24465e"/><path d="M23 0h68" stroke="#79b9ff" stroke-width="2"/><text x="23" y="35" fill="#a7bfd0" font-size="12" font-weight="600" letter-spacing="1.5">BIOLOGY &amp; DNA</text><text x="353" y="35" fill="#79dfd0" font-size="13" font-weight="600" text-anchor="end">03</text><g transform="translate(23 56) scale(.63)" fill="none" stroke="#79b9ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c32 10 32 34 0 46M42 3c-32 10-32 34 0 46M18 8h18M15 44h24M16 16h22M16 36h22M14 26h26"/></g><text x="23" y="124" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">Life histories</text><text x="23" y="153" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">&amp; population structure</text><text x="23" y="193" fill="#a7bfd0" font-size="16" font-weight="400" >Biological observations and</text><text x="23" y="222" fill="#a7bfd0" font-size="16" font-weight="400" >genetic evidence.</text></g><g transform="translate(15 372)"><rect width="376" height="244" rx="16" fill="#102a3f" stroke="#24465e"/><path d="M23 0h68" stroke="#79dfd0" stroke-width="2"/><text x="23" y="35" fill="#a7bfd0" font-size="12" font-weight="600" letter-spacing="1.5">OCEAN CHANGE</text><text x="353" y="35" fill="#79dfd0" font-size="13" font-weight="600" text-anchor="end">04</text><g transform="translate(23 56) scale(.63)" fill="none" stroke="#79dfd0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 29c8-12 17 12 26 0s17 12 26 0M1 42c8-12 17 12 26 0s17 12 26 0"/><circle cx="28" cy="11" r="7"/></g><text x="23" y="124" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">Climate change</text><text x="23" y="153" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">&amp; marine ecosystems</text><text x="23" y="193" fill="#a7bfd0" font-size="16" font-weight="400" >Environmental variability and</text><text x="23" y="222" fill="#a7bfd0" font-size="16" font-weight="400" >the responses of marine species.</text></g><g transform="translate(409 372)"><rect width="376" height="244" rx="16" fill="#102a3f" stroke="#24465e"/><path d="M23 0h68" stroke="#79b9ff" stroke-width="2"/><text x="23" y="35" fill="#a7bfd0" font-size="12" font-weight="600" letter-spacing="1.5">MANAGEMENT</text><text x="353" y="35" fill="#79dfd0" font-size="13" font-weight="600" text-anchor="end">05</text><g transform="translate(23 56) scale(.63)" fill="none" stroke="#79b9ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M27 3 48 12v16c0 11-21 22-21 22S6 39 6 28V12Z"/><path d="m17 26 7 7 13-15"/></g><text x="23" y="124" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing="-.5">Climate-adaptive</text><text x="23" y="153" fill="#edf6ff" font-size="24" font-weight="650" letter-spacing